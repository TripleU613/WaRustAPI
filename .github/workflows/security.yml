name: Dependency security

on:
  pull_request:
    paths: [Cargo.lock, '**/Cargo.toml', .github/workflows/security.yml]
  push:
    branches: [main]
    paths: [Cargo.lock, '**/Cargo.toml', .github/workflows/security.yml]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file Cargo.lock
