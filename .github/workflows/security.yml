name: Dependency security

on:
  pull_request:
    paths: [Cargo.lock, '**/Cargo.toml', .github/workflows/security.yml]
  push:
    branches: [main]
    paths: [Cargo.lock, '**/Cargo.toml', .github/workflows/security.yml]
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file Cargo.lock
