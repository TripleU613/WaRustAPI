name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Job 1 (docs/design/README.md 19.4): formatting, Clippy and compilation for the supported
  # target/feature combinations. Linux x86_64 is the only proof target.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # Job 2: unit, fixture, property and crash/replay tests, offline once
  # dependencies are fetched. Live interoperability is a separate job that is
  # never triggered by pull requests (docs/design/README.md 19.3).
  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            args: --workspace
          - profile: noise
            args: -p whatsapp-api --features experimental-noise
          - profile: registration-https
            args: -p whatsapp-api --features experimental-registration-https
          - profile: all-features
            args: --workspace --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked ${{ matrix.args }}

  # Job 3 + 4: dependency/native-build audit and Rust-only protobuf
  # regeneration with a clean generated-code diff.
  audit:
    name: dependency audit + proto check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p xtask -- proto-check
      - run: cargo run --locked -p xtask -- dependency-audit
      - name: dependency report is committed and current
        run: git diff --exit-code -- docs/protocol/dependency-report.md

  # Job 5: package verification outside the workspace context.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked -p whatsapp-api --allow-dirty
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
