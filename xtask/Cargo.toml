[package]
name = "xtask"
version = "0.0.1"
description = "Rust-only repository automation: schema generation, dependency audit, reference manifest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# Rust-only protobuf compilation (section 2.2). Descriptor types must stay on
# compatible versions: protox 0.9 <-> prost-build/prost-types 0.14.
protox = "0.9"
prost-build = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
cargo_metadata = "0.23"
# APK inspection for the reference manifest; bzip2/zstd/aes backends are
# deliberately off so no C library enters the graph.
zip.workspace = true
whatsapp-api = { path = "../crates/whatsapp-api", features = ["token-material"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
