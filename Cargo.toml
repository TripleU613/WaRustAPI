[workspace]
resolver = "3"
members = ["crates/whatsapp-api", "crates/whatsapp-cli", "xtask"]
default-members = ["crates/whatsapp-api", "crates/whatsapp-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TripleU613/TeleWhatsApp"

[workspace.dependencies]
# Async runtime and networking (section 18). Features are enabled per crate.
tokio = { version = "1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std", "serde"] }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive", "serde"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
# Transactional store: pure-Rust ACID embedded database (ADR 0002).
redb = "4"
# Storage AEAD: XChaCha20-Poly1305 with 24-byte random nonces (section 11.3).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Key wrapping / domain separation for the at-rest key hierarchy (section 11.3).
hkdf = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Comparison-build registration-token derivation observed in the Android APK.
hmac = { version = "0.12", default-features = false }
sha1 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
md-5 = { version = "0.10", default-features = false }
# ZIP archive reading for token material extraction from APK.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# OS-backed CSPRNG (section 18).
getrandom = { version = "0.4", default-features = false, features = ["std"] }
# Noise backend candidate with the Rust crypto resolver; `std` is deliberately
# off because snow's `std` feature activates its optional `ring` dependency (ADR 0004).
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto"] }
# Protobuf runtime; generated code is committed and regenerated by xtask (section 2.2).
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
# Bounded zlib inflation for compressed binary-node frames (pure Rust).
miniz_oxide = { version = "0.9", default-features = false, features = ["std", "with-alloc"] }
clap = { version = "4", features = ["derive", "env"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
# Registration HTTPS: explicitly selected rustls/ring provider (ADR 0003).
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
# Contains AGPL-marked Signal sources despite MIT package metadata (ADR 0005).
wacore-libsignal = { version = "=0.7.0", default-features = false }
rand = "0.10"
# Pinned native ML-KEM-1024 vector comparison; experimental primitive only.
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
