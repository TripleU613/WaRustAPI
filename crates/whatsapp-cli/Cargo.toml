[package]
name = "whatsapp-cli"
version = "0.0.1"
description = "Operator CLI and local HTTP control plane for whatsapp-api"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
experimental-signup = ["whatsapp-api/experimental-signal-crypto", "whatsapp-api/experimental-registration-https"]
experimental-transport = ["experimental-signup", "whatsapp-api/comparison-client"]

[[bin]]
name = "whatsapp-cli"
path = "src/main.rs"

[dependencies]
whatsapp-api = { path = "../whatsapp-api" }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process"] }
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
