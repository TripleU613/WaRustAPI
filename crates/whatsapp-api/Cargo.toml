[package]
name = "whatsapp-api"
version = "0.0.1"
description = "Standalone async Rust library for operating a WhatsApp primary device (experimental, offline gates only)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["whatsapp", "messaging", "protocol"]
categories = ["network-programming"]
publish = false
include = ["src/**", "README.md", "Cargo.toml", "fixtures/**", "LICENSE-*", "THIRD_PARTY_NOTICES.md"]

[features]
default = []
comparison-client = ["experimental-noise", "experimental-transport", "experimental-signal-crypto", "experimental-registration-https"]
# Experimental Noise transport adapter over `snow`. Kept behind a feature until
# the profile's handshake pattern is Observed rather than ReferenceOnly.
experimental-noise = ["dep:snow"]
# Opt-in comparison TCP connector; does not imply authenticated messaging.
experimental-transport = ["tokio/net"]
# Crypto and persisted lab registration; does not enable messaging or login.
experimental-signal-crypto = ["dep:wacore-libsignal", "dep:rand", "dep:async-trait", "dep:ml-kem"]
# Lab-only registration transport; maintained TLS provider, unverified protocol.
experimental-registration-https = [
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-roots",
]
# Token material extraction from APK archives for registration-token derivation.
token-material = ["dep:zip"]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
# APK JSONObject numeric coercion can branch at integer boundaries. The default
# fast parser rounded 0.99999999999999994 to 1; Java Double correctly stays below.
serde_json = { workspace = true, features = ["float_roundtrip"] }
zeroize.workspace = true
hex.workspace = true
redb.workspace = true
chacha20poly1305.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
pbkdf2.workspace = true
md-5.workspace = true
getrandom.workspace = true
prost.workspace = true
miniz_oxide.workspace = true
snow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
wacore-libsignal = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ml-kem = { workspace = true, optional = true }
async-trait = { version = "0.1.92", optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# Suspend-aware elapsed clock for APK 08B.A04/A07.
rustix = { version = "1.1", features = ["time"] }
