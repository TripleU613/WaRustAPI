[package]
name = "whatsapp-api"
version = "0.0.1"
description = "Standalone async Rust library for operating a WhatsApp primary device (experimental, offline gates only)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["whatsapp", "messaging", "protocol"]
categories = ["network-programming"]
publish = false
include = ["src/**", "README.md", "Cargo.toml", "fixtures/**", "LICENSE-*", "THIRD_PARTY_NOTICES.md"]

[features]
default = []
# Experimental Noise transport adapter over `snow`. Kept behind a feature until
# the profile's handshake pattern is Observed rather than ReferenceOnly.
experimental-noise = ["dep:snow"]
# Crypto adapter only; does not enable messaging or an unverified login flow.
experimental-signal-crypto = ["dep:wacore-libsignal"]
# Lab-only registration transport; maintained TLS provider, unverified protocol.
experimental-registration-https = [
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-roots",
]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
redb.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
pbkdf2.workspace = true
md-5.workspace = true
getrandom.workspace = true
prost.workspace = true
miniz_oxide.workspace = true
snow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
wacore-libsignal = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
